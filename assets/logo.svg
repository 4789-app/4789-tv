<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     role="img" aria-label="8 Tree Player">
  <title>8 Tree Player</title>
  <!--
    The numeral 8 read as a tree: a hollow canopy above, a solid root mass below.

    Three earlier drafts put the trunk and roots as strokes *inside* the lower loop, and every one
    of them read as a peace sign — a vertical line inside a circle with diagonals off it is that
    symbol, no matter how the diagonals are angled or how asymmetric they are. The fix is
    structural rather than cosmetic: the lower loop carries no interior lines at all. It is filled.

    That also gives the mark a light/heavy contrast that survives being shrunk to a favicon, where
    fine interior strokes would have closed up into mush anyway.
  -->
  <g fill="none" stroke="currentColor" stroke-width="3.4"
     stroke-linecap="round" stroke-linejoin="round">
    <!-- canopy: the open upper loop of the 8 -->
    <circle cx="32" cy="20" r="12"/>

    <!-- branches inside the canopy, lifting from where the trunk enters -->
    <path d="M32 30v-9"/>
    <path d="M32 24.5l-5.5 -5M32 21.5l5.5 -5"/>
  </g>

  <!-- root mass: the solid lower loop. No interior strokes, so no peace sign. -->
  <circle cx="32" cy="44.5" r="14.5" fill="currentColor"/>

  <!-- the trunk continues into the mass as a negative-space notch, which keeps the two loops
       reading as one continuous figure rather than a circle sitting under a ring -->
  <path d="M32 30v10" stroke="currentColor" stroke-width="3.4" stroke-linecap="round"/>
</svg>
