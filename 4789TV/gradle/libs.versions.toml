[versions]
agp = "8.12.2"
kotlin = "2.2.20"
compileSdk = "36"
ktor = "3.3.2"
kotlinxSerialization = "1.9.0"
kotlinxCoroutines = "1.10.2"
androidxCore = "1.17.0"
androidxAppcompat = "1.7.1"
androidxLifecycle = "2.9.3"
libmpv = "1.0.0"
# DO NOT BUMP without a cold-open install test on a real Fire OS 7 (API 28) box — this
# compiles, lints, and unit-tests clean even when playback never begins at runtime.
# History: 1.10.1 was tried and reverted on 2026-08-03, blamed on a ClassNotFoundException for
# android.view.Choreographer$VsyncCallback in VideoFrameReleaseHelper. That log line is benign
# ART noise at level I; the real fault was the audio-capabilities bug, which 1.5.1 had too.
# 1.7.1 (2026-08-04) is the smaller step, taken to reach the ffmpeg audio decoders — the
# 1.5.1 engine cannot decode DTS/TrueHD at all, which is the receiver's top playback failure.
media3 = "1.7.1"
# Must match `media3` exactly — the artifact is versioned <media3>-<nextlib>.
nextlib = "1.7.1-0.9.0"
junit = "4.13.2"
composeBom = "2025.08.01"
androidxActivity = "1.10.1"
androidxNavigation = "2.9.3"
androidxTestRunner = "1.7.0"
androidxWork = "2.10.1"
tink = "1.23.0"
coil = "2.7.0"
okhttp = "4.12.0"
tvMaterial = "1.1.0"
zxing = "3.5.4"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCore" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidxAppcompat" }
androidx-lifecycle-service = { module = "androidx.lifecycle:lifecycle-service", version.ref = "androidxLifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidxLifecycle" }
media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3" }
media3-datasource-okhttp = { module = "androidx.media3:media3-datasource-okhttp", version.ref = "media3" }
media3-effect = { module = "androidx.media3:media3-effect", version.ref = "media3" }
ktor-server-cio = { module = "io.ktor:ktor-server-cio", version.ref = "ktor" }
ktor-server-websockets = { module = "io.ktor:ktor-server-websockets", version.ref = "ktor" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
libmpv = { module = "dev.jdtech.mpv:libmpv", version.ref = "libmpv" }
# Prebuilt Media3 ffmpeg decoder extension (the same one Just Player ships): AC3, EAC3, DTS,
# DTS-HD, TrueHD, MLP and friends in software, while video stays on the hardware MediaCodec —
# the split Kodi has always used and the only reason it plays REMUX audio this box cannot.
# Version string is <media3 version>-<nextlib version>; it MUST track `media3` above.
nextlib-media3ext = { module = "io.github.anilbeesetti:nextlib-media3ext", version.ref = "nextlib" }
junit = { module = "junit:junit", version.ref = "junit" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivity" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "androidxNavigation" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-work-runtime = { module = "androidx.work:work-runtime-ktx", version.ref = "androidxWork" }
tink = { module = "com.google.crypto.tink:tink", version.ref = "tink" }
coil-compose = { module = "io.coil-kt:coil-compose", version.ref = "coil" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
tv-material = { module = "androidx.tv:tv-material", version.ref = "tvMaterial" }
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
