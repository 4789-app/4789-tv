name: build

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  gradle:
    name: contract, phone, sideload TV, Play TV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          # The receiver targets the Fire OS 7 runtime and builds under JDK 17; a newer JDK
          # changes Gradle's toolchain resolution and the build stops matching what ships.
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        working-directory: .
        run: ./scripts/check-android-foundation.sh --clean

      - name: Keep QA artifacts for inspection
        uses: actions/upload-artifact@v4
        with:
          name: android-qa-artifacts
          path: |
            phone/build/outputs/apk/debug/phone-debug.apk
            phone/build/outputs/bundle/debug/phone-debug.aab
            app/build/outputs/apk/debug/app-debug.apk
            tvplay/build/outputs/apk/debug/tvplay-debug.apk
            tvplay/build/outputs/bundle/debug/tvplay-debug.aab
          if-no-files-found: error
