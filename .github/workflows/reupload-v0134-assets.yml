name: Reupload v0.1.34 assets

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reupload:
    runs-on: ubuntu-latest
    steps:
      - name: Download existing v0.1.34 assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download v0.1.34 --dir assets --repo "$GITHUB_REPOSITORY"

      - name: Re-upload v0.1.34 assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload v0.1.34 assets/4789tv.apk assets/SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"
