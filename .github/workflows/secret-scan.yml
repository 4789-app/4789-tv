name: secret-scan

# A credential committed once is a credential leaked forever, because the history keeps it even
# after the file is deleted. This gate is cheap and runs on everything.
on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    # Rules get better over time; re-scan an unchanged tree weekly.
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: a secret removed in the newest commit is still published by the old one.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          version=8.28.0
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan the working tree
        run: gitleaks detect --no-git --redact --verbose --exit-code 1

      - name: Scan the full history
        run: gitleaks git --redact --verbose --exit-code 1
