# Install at .github/workflows/tv-release-candidate.yml in 4789-app/4789-tv.
# Canonical checkout layout must retain 4789TV/, App/.../Fonts and docs/contract-samples.
name: TV compatibility release candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    if: github.repository == '4789-app/4789-tv'
    runs-on: ubuntu-latest
    environment: tv-release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install pinned Android tools
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Restore established compatibility key
        env:
          TV_COMPAT_KEYSTORE_BASE64: ${{ secrets.TV_COMPAT_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.android"
          test -n "$TV_COMPAT_KEYSTORE_BASE64"
          printf '%s' "$TV_COMPAT_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android \
            | sed -n 's/.*SHA-256): //p;s/.*SHA256: //p' | head -2
          ls -l "$HOME/.android/debug.keystore"
      - name: Verify all Android products
        working-directory: 4789TV
        run: ./scripts/check-android-foundation.sh --clean
      - name: Package compatibility candidate
        run: |
          set -euo pipefail
          mkdir -p release-candidate
          cp 4789TV/app/build/outputs/apk/debug/app-debug.apk release-candidate/4789tv.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs release-candidate/4789tv.apk | tee release-candidate/SIGNATURE.txt
          grep -Fq 'certificate SHA-256 digest: fe937c685e7cd2c010af76a23c6ea4be0114b0e4146b62cc917dcd19b2d43205' release-candidate/SIGNATURE.txt
          python3 4789TV/scripts/export-public-source.py "$GITHUB_SHA" release-candidate
          (cd release-candidate && sha256sum 4789tv.apk first-party-source.tar.gz SOURCE_PROVENANCE.json > SHA256SUMS.txt)
      - name: Remove signing material
        if: always()
        run: rm -f "$HOME/.android/debug.keystore"
      - uses: actions/upload-artifact@v4
        with:
          name: tv-release-candidate-${{ github.sha }}
          path: release-candidate/
          if-no-files-found: error
# This deliberately produces a candidate only. Complete native corresponding source,
# exact signed APK device acceptance, and an immutable source tag precede public release.
