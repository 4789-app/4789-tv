name: build

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  gradle:
    name: unit tests, lint, debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          # The receiver targets the Fire OS 7 runtime and builds under JDK 17; a newer JDK
          # changes Gradle's toolchain resolution and the build stops matching what ships.
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        working-directory: .
        run: ./gradlew --no-daemon clean testDebugUnitTest lintDebug assembleDebug

      - name: Keep the APK for inspection
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
